<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VoyageRise</title>
    <link rel="icon" type="image/png" href="assets/images/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        .error-hero {
            position: relative;
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.05) 0%, transparent 60%);
            overflow: hidden;
        }
        .error-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.08) 0%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }
        .compass-interactive {
            display: inline-block;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--primary-accent);
            cursor: pointer;
        }
        .compass-interactive:hover {
            transform: rotate(360deg) scale(1.15);
        }
        
        .float-card-1 {
            animation: floatSlow1 6s ease-in-out infinite;
        }
        .float-card-2 {
            animation: floatSlow2 8s ease-in-out infinite reverse;
        }
        @keyframes floatSlow1 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes floatSlow2 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
    </style>
</head>

<body class="bg-primary-bg overflow-hidden">

    <div class="container py-4 text-center">
        <a class="navbar-brand d-flex align-items-center justify-content-center mb-3" href="index.html">
            <img src="assets/images/logo.svg" alt="VoyageRise Logo" height="40" class="me-2" style="width: 40px;">
            <span class="fw-bold text-white fs-2">Voyage<span class="text-gradient">Rise</span></span>
        </a>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <a href="dashboard.html" class="btn btn-outline-custom btn-sm d-flex align-items-center" title="Dashboard">
                <i class="bi bi-grid-fill"></i>
            </a>
            <div class="d-flex gap-2 ms-2">
                <button class="btn btn-outline-custom btn-sm d-flex align-items-center justify-content-center nav-toggle-btn" id="theme-toggle" title="Toggle Theme">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <button class="btn btn-outline-custom btn-sm d-flex align-items-center justify-content-center nav-toggle-btn" id="rtl-toggle" title="RTL">
                    RTL
                </button>
            </div>
            <a href="login.html" class="btn btn-primary-custom btn-sm d-flex align-items-center" title="Login">
                Login
            </a>
        </div>
    </div>

    <div class="error-hero">
        <div class="error-glow" style="top: 20%; left: 30%;"></div>
        
        <div class="glass-card p-5 text-center float-card-1" style="max-width: 500px; z-index: 10;">
            <h1 class="display-1 fw-extrabold text-gradient mb-0" style="font-weight: 850;">404</h1>
            <div class="mb-4 mt-2">
                <i class="bi bi-compass fs-1 compass-interactive" id="compass-icon"></i>
            </div>
            <h2 class="h4 text-white mb-3">It seems this flight has drifted off course.</h2>
            <p class="text-secondary mb-4 text-sm">The page or travel itinerary you are looking for does not exist or has been relocated. Return home or contact support if you need assistance.</p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="index.html" class="btn btn-primary-custom px-4">Back to Home</a>
                <a href="contact.html" class="btn btn-outline-custom px-4">Report Issue</a>
            </div>
        </div>

        <!-- Decorative floating elements -->
        <div class="position-absolute d-none d-lg-block float-card-1" style="top: 25%; right: 18%; z-index: 5;">
            <div class="glass-card p-3 opacity-50"><i class="bi bi-airplane-fill fs-2 text-primary-accent"></i></div>
        </div>
        <div class="position-absolute d-none d-lg-block float-card-2" style="bottom: 25%; left: 18%; z-index: 5;">
            <div class="glass-card p-3 opacity-50"><i class="bi bi-map-fill fs-2 text-secondary-accent"></i></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
